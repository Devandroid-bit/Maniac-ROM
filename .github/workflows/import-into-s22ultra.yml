name: Import mods into s22-Ultra
on: workflow_dispatch

jobs:
  import-folders:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout s22-Ultra
        uses: actions/checkout@v4
        with:
          ref: s22-Ultra
          fetch-depth: 0

      - name: Fetch sixteen branch
        run: git fetch origin sixteen

      - name: Copy folders from sixteen
        run: |
          FOLDERS=(
            "prebuilts/samsung/a56xnaxx"
            "prebuilts/samsung/gts11xx"
            "prebuilts/samsung/pa2qxxx"
            "unica/mods/paradigm/semanticsearch/SecSettingsIntelligence.apk/res/raw"
          )
          for f in "${FOLDERS[@]}"; do
            echo "== Importing $f =="
            rm -rf "$f"
            mkdir -p "$(dirname "$f")"
            if git checkout origin/sixteen -- "$f"; then
              echo "OK: $f imported"
            else
              echo "WARNING: $f not found in sixteen, skipping"
            fi
          done

      - name: Configure Bot Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Update
        run: |
          FOLDERS=(
            "platform/exynos9825"
            "prebuilts/samsung/p3sxxx"
          )
          for f in "${FOLDERS[@]}"; do
            if [ -e "$f" ]; then
              git add "$f"
            else
              echo "Skipping add: $f does not exist"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes detected. s22-Ultra is already up to date."
          else
            git commit -m "Import platform "exynos9825" and prebuilts "p3sxxx" from sixteen"
            git pull --rebase origin s22-Ultra
            git push origin s22-Ultra
          fi
