name: Import d1 from EternityROM
on: workflow_dispatch

jobs:
  import-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout UN1CA Repository
        uses: actions/checkout@v4
        with:
          ref: sixteen

      - name: Fetch and Copy d1
        run: |
          # 1. I clone just the top layer of EternityROM's 'fifteen' branch to save time
          git clone --depth 1 -b fifteen https://github.com/Ocin4ever/EternityROM.git /tmp/EternityROM
          
          # 2. I make sure the 'target' directory exists in my UN1CA workspace
          mkdir -p target
          
          # 3. I remove any old d1 folder to avoid mixing old and new files
          rm -rf target/d1
          
          # 4. I copy the fresh d1 folder exactly where it belongs
          cp -r /tmp/EternityROM/target/d1 target/

      - name: Configure Bot Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Update
        run: |
          git add target/d1
          
          if git diff --cached --quiet; then
            echo "No changes detected. The d1xks folder is already up to date."
          else
            git commit -m "Import d1 target from EternityROM (Credits: @Ocin4ever)"
            git pull --rebase origin sixteen
            git push origin sixteen
          fi
